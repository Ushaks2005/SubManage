
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #263248;
        }

        .container {
            padding: 35px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #2563eb;
            text-decoration: none;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #172554;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="/admin" class="back-link">← Back to Dashboard</a>

        <div class="header">
            <h1>Payment Management</h1>
            <p>View and monitor customer payment details.</p>
        </div>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>Payment ID</th>
                        <th>Customer Name</th>
                        <th>Subscription ID</th>
                        <th>Amount</th>
                        <th>Payment Date</th>
                        <th>Payment Method</th>
                        <th>Payment Status</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="payment : ${payments}">
                        <td th:text="${payment.payment_id}"></td>
                        <td th:text="${payment.full_name}"></td>
                        <td th:text="${payment.subscription_id}"></td>
                        <td>₹<span th:text="${payment.amount}"></span></td>
                        <td th:text="${payment.payment_date}"></td>
                        <td th:text="${payment.payment_method}"></td>
                        <td class="status"
                            th:text="${payment.payment_status}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="7">No payment records found.</td>
                    </tr>

                </tbody>
            </table>

        </div>

    </div>

</body>
</html>
