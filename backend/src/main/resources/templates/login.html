
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Management | Login</title>

    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/login.js" defer></script>
</head>

<body>

    <div class="login-container">

        <div class="login-left">
            <div class="brand">
                <div class="brand-icon">S</div>
                <h2>SubManage</h2>
            </div>

            <div class="welcome-content">
                <h1>Manage Your Subscriptions Smarter.</h1>
                <p>
                    A simple and powerful platform to manage subscriptions,
                    track service usage and monitor payments.
                </p>
            </div>

            <div class="footer-text">
                © 2026 SubManage. All rights reserved.
            </div>
        </div>

        <div class="login-right">

            <div class="login-box">

                <h2>Welcome Back!</h2>
                <p class="subtitle">Please sign in to your account.</p>

                <form id="loginForm" action="/login" method="post">

                    <div class="form-group">
                        <label for="role">Login As</label>
                        <select id="role" name="role" required>
                            <option value="">Select your role</option>
                            <option value="ADMIN">Admin</option>
                            <option value="CUSTOMER">Customer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>
                    </div>

                    <p id="errorMessage" class="error-message"></p>

                    <button type="submit" class="login-button">
                        Sign In
                    </button>

                </form>

                <p class="login-note">
                    Secure access to your subscription account.
                </p>

            </div>

        </div>

    </div>

</body>
</html>
